<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In / Register | Midnight Cinema</title>
    <link rel="stylesheet" href="css/base.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .auth-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 100px var(--space-4) var(--space-6);
        }
        .auth-card {
            background: var(--bg-panel);
            padding: 2.5rem;
            border-radius: 18px;
            border: 1px solid var(--border-glass);
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }
        .auth-header {
            text-align: center;
            margin-bottom: 1.75rem;
        }
        .auth-logo {
            font-family: var(--font-display);
            font-size: 1.8rem;
            color: var(--accent-red);
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .input-group {
            margin-bottom: 1.25rem;
        }
        .input-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 0.35rem;
        }
        input {
            width: 100%;
            padding: 0.85rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border-glass);
            background: var(--bg-darkest); color: var(--text-primary);
            font-size: 0.95rem;
            outline: none;
            transition: border-color var(--time-fast);
        }
        input:focus {
            border-color: var(--accent-coral);
            box-shadow: 0 0 0 2px rgba(255, 107, 128, 0.2);
        }

        .submit-btn {
            width: 100%;
            padding: 0.9rem;
            margin-top: 0.75rem;
            font-size: 1rem;
        }

        .switch-mode {
            text-align: center;
            margin-top: 1.5rem;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.9rem;
            transition: color var(--time-fast);
        }
        .switch-mode:hover {
            color: var(--accent-coral);
        }

        .demo-box {
            background: rgba(245, 193, 108, 0.08);
            border: 1px dashed rgba(245, 193, 108, 0.4);
            border-radius: 10px;
            padding: 0.85rem 1rem;
            margin-bottom: 1.5rem;
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .demo-info {
            color: var(--accent-gold);
        }
        .demo-fill-btn {
            background: rgba(245, 193, 108, 0.2);
            color: var(--accent-gold);
            border: none;
            padding: 0.35rem 0.75rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.8rem;
            transition: background var(--time-fast);
        }
        .demo-fill-btn:hover {
            background: var(--accent-gold);
            color: #000;
        }

        .form-error {
            background: rgba(248, 68, 100, 0.12);
            border: 1px solid var(--accent-red);
            color: #ff94a4;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 1.25rem;
            display: none;
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="nav-brand">Midnight Cinema</a>
        <div class="nav-links">
            <a href="index.html">Home</a>
        </div>
    </nav>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">Midnight Cinema</div>
                <h2 id="form-title" style="font-size: 1.4rem;">Sign In</h2>
                <p style="color: var(--text-secondary); font-size: 0.9rem; margin-top: 0.25rem;" id="form-subtitle">Enter your details to access your tickets</p>
            </div>

            <div class="demo-box" id="demo-box">
                <div class="demo-info">
                    <strong>Demo User:</strong> demo@bookmyshow.com
                </div>
                <button type="button" class="demo-fill-btn" id="btn-fill-demo">Autofill</button>
            </div>

            <div class="form-error" id="form-error"></div>

            <form id="auth-form">
                <div id="register-fields" style="display:none;">
                    <div class="input-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" placeholder="John Doe">
                    </div>
                    <div class="input-group">
                        <label for="phone">Phone Number</label>
                        <input type="text" id="phone" placeholder="9876543210">
                    </div>
                </div>
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required placeholder="name@example.com">
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-primary submit-btn" id="submit-btn">Sign In</button>
            </form>

            <div class="switch-mode" id="toggle-mode">Don't have an account? Register here</div>
        </div>
    </div>

    <script type="module" src="js/ui.js"></script>
    <script type="module">
        import { AuthService } from './js/auth.js';
        import { initNav, showToast } from './js/ui.js';

        initNav();

        let isLogin = true;

        document.getElementById('btn-fill-demo').onclick = () => {
            document.getElementById('email').value = 'demo@bookmyshow.com';
            document.getElementById('password').value = 'password123';
            showToast('Demo credentials inserted!', 'info');
        };

        document.getElementById('toggle-mode').onclick = () => {
            isLogin = !isLogin;
            const errorDiv = document.getElementById('form-error');
            errorDiv.style.display = 'none';

            document.getElementById('form-title').textContent = isLogin ? 'Sign In' : 'Create Account';
            document.getElementById('form-subtitle').textContent = isLogin 
                ? 'Enter your details to access your tickets'
                : 'Join Midnight Cinema for exclusive screenings';
            document.getElementById('submit-btn').textContent = isLogin ? 'Sign In' : 'Register Account';
            document.getElementById('register-fields').style.display = isLogin ? 'none' : 'block';
            document.getElementById('demo-box').style.display = isLogin ? 'flex' : 'none';
            document.getElementById('toggle-mode').textContent = isLogin 
                ? "Don't have an account? Register here" 
                : "Already have an account? Sign In here";
        };

        document.getElementById('auth-form').onsubmit = async (e) => {
            e.preventDefault();
            const errorDiv = document.getElementById('form-error');
            errorDiv.style.display = 'none';

            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Authenticating...';

            const email = document.getElementById('email').value.trim();
            const pass = document.getElementById('password').value;

            try {
                if (isLogin) {
                    await AuthService.login(email, pass);
                    showToast('Signed in successfully!', 'success');
                } else {
                    const name = document.getElementById('name').value.trim();
                    const phone = document.getElementById('phone').value.trim();
                    if (!name) throw new Error('Please enter your full name');
                    await AuthService.register(name, email, pass, phone);
                    showToast('Account registered and logged in!', 'success');
                }
                
                setTimeout(() => {
                    const redirect = sessionStorage.getItem('redirectAfterLogin');
                    if (redirect) {
                        sessionStorage.removeItem('redirectAfterLogin');
                        window.location.href = redirect;
                    } else {
                        window.location.href = 'index.html';
                    }
                }, 400);

            } catch (err) {
                console.error(err);
                errorDiv.textContent = err.message || 'Authentication failed. Please verify credentials.';
                errorDiv.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = isLogin ? 'Sign In' : 'Register Account';
            }
        };
    </script>
</body>
</html>
