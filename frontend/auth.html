<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign In | Midnight Cinema</title>
    <link rel="stylesheet" href="css/base.css">
    <style>
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .auth-card { background: var(--bg-panel); padding: var(--space-4); border-radius: 16px; border: 1px solid var(--border-glass); width: 100%; max-width: 400px; }
        .input-group { margin-bottom: var(--space-2); }
        input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border-glass); background: var(--bg-darkest); color: white; margin-top: 8px; }
        button { width: 100%; margin-top: var(--space-2); }
        .switch { text-align: center; margin-top: var(--space-2); color: var(--text-secondary); cursor: pointer; font-size: 0.9rem;}
        .switch:hover { color: var(--accent-coral); }
    </style>
</head>
<body>
    <div class="auth-card">
        <h2 id="form-title" style="margin-bottom: var(--space-3);">Sign In</h2>
        <form id="auth-form">
            <div id="register-fields" style="display:none;">
                <div class="input-group">
                    <label>Name</label>
                    <input type="text" id="name" placeholder="John Doe">
                </div>
                <div class="input-group">
                    <label>Phone</label>
                    <input type="text" id="phone" placeholder="9876543210">
                </div>
            </div>
            <div class="input-group">
                <label>Email</label>
                <input type="email" id="email" required placeholder="name@example.com">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-primary" id="submit-btn">Sign In</button>
        </form>
        <div class="switch" id="toggle-mode">Don't have an account? Register</div>
    </div>

    <script type="module">
        import { AuthService } from './js/auth.js';
        let isLogin = true;

        document.getElementById('toggle-mode').onclick = () => {
            isLogin = !isLogin;
            document.getElementById('form-title').textContent = isLogin ? 'Sign In' : 'Create Account';
            document.getElementById('submit-btn').textContent = isLogin ? 'Sign In' : 'Register';
            document.getElementById('register-fields').style.display = isLogin ? 'none' : 'block';
            document.getElementById('toggle-mode').textContent = isLogin ? "Don't have an account? Register" : "Already have an account? Sign In";
        };

        document.getElementById('auth-form').onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            try {
                if (isLogin) {
                    await AuthService.login(email, pass);
                } else {
                    const name = document.getElementById('name').value;
                    const phone = document.getElementById('phone').value;
                    await AuthService.register(name, email, pass, phone);
                }
                const redirect = sessionStorage.getItem('redirectAfterLogin');
                if (redirect) {
                    sessionStorage.removeItem('redirectAfterLogin');
                    window.location.href = redirect;
                } else {
                    window.location.href = 'index.html';
                }
            } catch(err) { alert(err.message); }
        };
    </script>
</body>
</html>
