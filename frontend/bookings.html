<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Bookings | Midnight Cinema</title>
    <link rel="stylesheet" href="css/base.css">
    <style>
        .page-container { padding: 100px var(--space-4) var(--space-4); max-width: 800px; margin: 0 auto; }
        .booking-card { background: var(--bg-panel); border: 1px solid var(--border-glass); border-radius: 12px; padding: var(--space-3); margin-bottom: var(--space-3); display: flex; justify-content: space-between; align-items: center; }
        .cancel-btn { background: transparent; border: 1px solid var(--accent-red); color: var(--accent-red); padding: 0.5rem 1rem; border-radius: 4px; }
        .cancel-btn:hover { background: var(--accent-red); color: white; }
    </style>
</head>
<body>
    <nav>
        <div class="nav-brand">Midnight Cinema</div>
        <div class="nav-links"><a href="index.html">Home</a></div>
    </nav>
    <div class="page-container">
        <h1>My Bookings</h1>
        <div id="bookings-list" style="margin-top: 2rem;">Loading...</div>
    </div>

    <script type="module">
        import { fetchApi } from './js/api.js';
        import { AuthService } from './js/auth.js';

        async function init() {
            const user = AuthService.getCurrentUser();
            if(!user) return window.location.href = 'auth.html';

            try {
                const bookings = await fetchApi(`/bookings/user/${user.id}`);
                const list = document.getElementById('bookings-list');
                list.innerHTML = '';
                if(bookings.length === 0) { list.innerHTML = '<p>No bookings found.</p>'; return; }

                bookings.forEach(b => {
                    const div = document.createElement('div');
                    div.className = 'booking-card';
                    const seats = b.seats.map(s => s.seatNumber).join(', ');
                    div.innerHTML = `
                        <div>
                            <h3 style="color:var(--accent-coral);">${b.movieTitle}</h3>
                            <p>${b.theaterName} • ${b.screenName}</p>
                            <p style="margin-top:4px;">Seats: ${seats}</p>
                            <p style="color:var(--text-tertiary); font-size:0.9rem; margin-top:8px;">Status: ${b.bookingStatus} • Total: ₹${b.totalPrice}</p>
                        </div>
                        ${b.bookingStatus !== 'CANCELLED' ? `<button class="cancel-btn" onclick="cancel(${b.bookingId})">Cancel</button>` : '<span style="color:red;">Cancelled</span>'}
                    `;
                    list.appendChild(div);
                });
            } catch(e) { console.error(e); }
        }

        window.cancel = async function(id) {
            if(confirm('Are you sure you want to cancel this booking?')) {
                try {
                    await fetchApi(`/bookings/${id}/cancel`, { method: 'PUT' });
                    location.reload();
                } catch(e) { alert(e.message); }
            }
        };

        init();
    </script>
</body>
</html>
