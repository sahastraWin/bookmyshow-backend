<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Seat Selection | Midnight Cinema</title>
    <link rel="stylesheet" href="css/base.css">
    <style>
        .page-container { padding: 100px var(--space-4) var(--space-4); max-width: 800px; margin: 0 auto; text-align: center;}
        .screen-curve { height: 40px; border-top: 4px solid var(--accent-coral); border-radius: 50% 50% 0 0; margin-bottom: 3rem; filter: drop-shadow(0 10px 20px rgba(248, 68, 100, 0.4)); }
        .seat-grid { display: flex; flex-direction: column; gap: 1rem; align-items: center;}
        .seat-row { display: flex; gap: 1rem; justify-content: center; }
        .seat { width: 40px; height: 40px; border: 2px solid var(--border-glass); border-radius: 8px 8px 4px 4px; cursor: pointer; transition: all var(--time-fast); background: var(--bg-panel); color: white; display:flex; align-items:center; justify-content:center; font-size: 0.8rem;}
        .seat:hover:not(.booked) { border-color: var(--accent-coral); }
        .seat.selected { background: var(--accent-red); border-color: var(--accent-red); }
        .seat.booked { background: var(--border-glass); cursor: not-allowed; opacity: 0.5; }
        .bottom-bar { position: fixed; bottom: 0; left: 0; width: 100%; padding: var(--space-3) var(--space-4); background: var(--bg-panel); border-top: 1px solid var(--border-glass); display: flex; justify-content: space-between; align-items: center; z-index: 100;}
    </style>
</head>
<body>
    <nav>
        <div class="nav-brand">Midnight Cinema</div>
        <div class="nav-links"><a href="index.html">Home</a></div>
    </nav>
    <div class="page-container">
        <h2>Select Seats</h2>
        <p style="margin-bottom: 2rem; color: var(--text-secondary);" id="show-info">Loading...</p>
        <div class="screen-curve">Screen This Way</div>
        <div class="seat-grid" id="seat-grid"></div>
    </div>
    
    <div class="bottom-bar">
        <div>
            <div id="price-total" style="font-size: 1.5rem; font-weight: bold;">₹0</div>
            <div id="seat-labels" style="color: var(--text-secondary); font-size: 0.9rem;">No seats selected</div>
        </div>
        <button class="btn-primary" id="btn-book" disabled>Book Ticket</button>
    </div>

    <script type="module">
        import { fetchApi } from './js/api.js';
        import { AuthService } from './js/auth.js';
        
        let selectedSeats = [];
        let ticketPrice = 0;
        let showId = null;

        async function init() {
            const params = new URLSearchParams(window.location.search);
            showId = params.get('showId');
            if(!showId) return window.location.href = 'index.html';
            
            if(!AuthService.getCurrentUser()) {
                sessionStorage.setItem('redirectAfterLogin', window.location.href);
                window.location.href = 'auth.html';
                return;
            }

            try {
                const show = await fetchApi(`/shows/${showId}`);
                ticketPrice = show.ticketPrice;
                document.getElementById('show-info').textContent = `${show.movieTitle} • ${show.theaterName} • ${show.startTime}`;
                
                const seats = await fetchApi(`/seats/show/${showId}`);
                const grid = document.getElementById('seat-grid');
                
                // Group by row
                const rows = seats.reduce((acc, s) => {
                    if(!acc[s.row]) acc[s.row] = [];
                    acc[s.row].push(s);
                    return acc;
                }, {});

                for(let rowName in rows) {
                    const rowDiv = document.createElement('div');
                    rowDiv.className = 'seat-row';
                    rows[rowName].forEach(s => {
                        const seatBtn = document.createElement('div');
                        seatBtn.className = 'seat ' + (s.status === 'BOOKED' ? 'booked' : '');
                        seatBtn.textContent = s.seatNumber;
                        seatBtn.onclick = () => toggleSeat(s, seatBtn);
                        rowDiv.appendChild(seatBtn);
                    });
                    grid.appendChild(rowDiv);
                }

                document.getElementById('btn-book').onclick = bookSeats;

            } catch(e) { console.error(e); }
        }

        function toggleSeat(seat, el) {
            if (seat.status === 'BOOKED') return;
            const idx = selectedSeats.findIndex(s => s.id === seat.id);
            if (idx > -1) {
                selectedSeats.splice(idx, 1);
                el.classList.remove('selected');
            } else {
                selectedSeats.push(seat);
                el.classList.add('selected');
            }
            updateBar();
        }

        function updateBar() {
            const total = selectedSeats.length * ticketPrice;
            document.getElementById('price-total').textContent = `₹${total}`;
            document.getElementById('seat-labels').textContent = selectedSeats.length ? selectedSeats.map(s => s.seatNumber).join(', ') : 'No seats selected';
            document.getElementById('btn-book').disabled = selectedSeats.length === 0;
        }

        async function bookSeats() {
            const user = AuthService.getCurrentUser();
            try {
                const payload = {
                    userId: user.id,
                    showId: parseInt(showId),
                    seatIds: selectedSeats.map(s => s.id)
                };
                const res = await fetchApi('/bookings', { method: 'POST', body: JSON.stringify(payload) });
                window.location.href = `confirmation.html?bookingId=${res.bookingId}`;
            } catch(e) { alert(e.message); }
        }

        init();
    </script>
</body>
</html>
