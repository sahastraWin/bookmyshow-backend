# Production configuration for Cloud Deployment (Render)
# If DB_URL is provided in Render Environment, Spring Boot connects to your remote MySQL.
# Otherwise, it falls back to an embedded in-memory database with MySQL mode so the app starts immediately!

spring.datasource.url=${DB_URL:jdbc:h2:mem:bookmyshow;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=USER}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# Database seeding
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Port binding for Render
server.port=${PORT:8080}
