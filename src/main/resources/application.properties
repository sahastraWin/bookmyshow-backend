spring.application.name=BookMyShow
# ── Database ───────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bookmyshow?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:nitr@123}
# ── JPA / Hibernate ────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
# ── Server ─────────────────────────────────────────────────
server.port=8080
# ── Jackson ────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
