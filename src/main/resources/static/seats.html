<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Seats | Midnight Cinema</title>
    <link rel="stylesheet" href="css/base.css">
    <style>
        .page-container {
            padding: 100px var(--space-4) 140px;
            max-width: 900px;
            margin: 0 auto;
            text-align: center;
        }

        .show-meta-card {
            background: var(--bg-panel);
            border: 1px solid var(--border-glass);
            border-radius: 14px;
            padding: 1.25rem 2rem;
            margin-bottom: 2rem;
            display: inline-block;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        }
        .show-meta-title {
            font-size: 1.6rem;
            color: var(--text-primary);
            margin-bottom: 0.35rem;
        }
        .show-meta-subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        /* Screen Curve */
        .screen-container {
            margin: 2rem auto 2.5rem;
            max-width: 600px;
            perspective: 400px;
        }
        .screen-curve {
            height: 18px;
            border-top: 5px solid var(--accent-coral);
            border-radius: 50% 50% 0 0;
            filter: drop-shadow(0 12px 24px rgba(248, 68, 100, 0.45));
            margin-bottom: 0.75rem;
        }
        .screen-text {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.25em;
            color: var(--text-tertiary);
            font-weight: 600;
        }

        /* Legend */
        .legend {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 2.5rem;
            flex-wrap: wrap;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 500;
        }
        .legend-seat {
            width: 22px;
            height: 22px;
            border-radius: 6px;
            border: 1px solid var(--border-glass-strong);
        }
        .legend-available { background: var(--bg-panel); border-color: rgba(128, 128, 128, 0.3); }
        .legend-selected { background: var(--accent-success); border-color: #059669; box-shadow: 0 0 12px var(--accent-success-glow); }
        .legend-booked { background: var(--border-glass); border-color: transparent; opacity: 0.35; }
        .legend-premium { background: rgba(245, 193, 108, 0.15); border-color: var(--accent-gold); }

        /* Seat Grid */
        .seat-grid {
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
            align-items: center;
            margin: 0 auto;
            max-width: 680px;
        }
        .seat-row {
            display: flex;
            gap: 0.75rem;
            align-items: center;
            justify-content: center;
        }
        .row-label {
            width: 26px;
            font-weight: 700;
            color: var(--text-tertiary);
            font-size: 0.85rem;
            text-align: right;
            margin-right: 0.5rem;
        }
        .seat {
            width: 40px;
            height: 40px;
            border: 1.5px solid var(--border-glass-strong);
            border-radius: 8px 8px 4px 4px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            background: var(--bg-panel);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 600;
            user-select: none;
        }
        .seat:hover:not(.booked) {
            border-color: var(--accent-success);
            transform: scale(1.12);
            z-index: 2;
            color: var(--accent-success);
        }
        .seat.premium {
            border-color: rgba(245, 193, 108, 0.5);
            background: rgba(245, 193, 108, 0.08);
        }
        
        /* Vibrant Green Selected Highlight */
        .seat.selected {
            background: var(--accent-success) !important;
            border-color: #059669 !important;
            color: #FFFFFF !important;
            box-shadow: 0 0 16px var(--accent-success-glow), inset 0 0 6px rgba(255, 255, 255, 0.3);
            transform: scale(1.12);
            font-weight: 700;
        }
        
        .seat.booked {
            background: rgba(128, 128, 128, 0.08);
            border-color: transparent;
            cursor: not-allowed;
            opacity: 0.35;
            color: transparent;
        }

        /* Bottom Fixed Checkout Bar */
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 1.25rem var(--space-4);
            background: var(--bg-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid var(--border-glass);
            z-index: 100;
            box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.4);
        }
        .bottom-bar-content {
            max-width: 1000px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .price-display {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-primary);
        }
        .seat-summary {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 0.2rem;
        }
        .seat-highlight-green {
            color: var(--accent-success);
            font-weight: 600;
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="nav-brand">🎬 Midnight Cinema</a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="shows.html">Browse Shows</a>
            <a href="auth.html" class="btn-primary btn-sm">Sign In</a>
        </div>
    </nav>

    <div class="page-container">
        <div class="show-meta-card">
            <h1 class="show-meta-title" id="movie-title">Loading Show...</h1>
            <div class="show-meta-subtitle" id="show-info">Auditorium seating</div>
        </div>

        <div class="screen-container">
            <div class="screen-curve"></div>
            <div class="screen-text">All eyes this way • Screen</div>
        </div>

        <div class="legend">
            <div class="legend-item"><div class="legend-seat legend-available"></div> Available</div>
            <div class="legend-item"><div class="legend-seat legend-selected"></div> Selected (Green)</div>
            <div class="legend-item"><div class="legend-seat legend-booked"></div> Booked</div>
            <div class="legend-item"><div class="legend-seat legend-premium"></div> Premium</div>
        </div>

        <div class="seat-grid" id="seat-grid">
            <p style="color: var(--text-secondary);">Loading auditorium layout...</p>
        </div>
    </div>
    
    <div class="bottom-bar">
        <div class="bottom-bar-content">
            <div>
                <div class="price-display" id="price-total">₹0</div>
                <div class="seat-summary" id="seat-labels">No seats selected</div>
            </div>
            <button class="btn-primary" id="btn-book" disabled style="min-width: 200px;">Select Seats</button>
        </div>
    </div>

    <script type="module" src="js/ui.js"></script>
    <script type="module">
        import { fetchApi } from './js/api.js';
        import { AuthService } from './js/auth.js';
        import { initNav, showToast, showSuccessPopup } from './js/ui.js';
        
        let selectedSeats = [];
        let ticketPrice = 0;
        let showId = null;
        let movieName = 'Movie';

        async function init() {
            initNav();

            const params = new URLSearchParams(window.location.search);
            showId = params.get('showId');
            if (!showId) {
                showId = 1; // Graceful default fallback
            }
            
            try {
                // Fetch Show Details
                const show = await fetchApi(`/shows/${showId}`);
                ticketPrice = show.ticketPrice || 250;
                movieName = show.movieTitle || 'Movie';
                document.getElementById('movie-title').textContent = movieName;
                document.getElementById('show-info').textContent = 
                    `${show.theaterName} • ${show.screenName} • ${show.startTime} • ₹${ticketPrice}/seat`;
                
                // Fetch Seats
                const seats = await fetchApi(`/seats/show/${showId}`);
                const grid = document.getElementById('seat-grid');
                grid.innerHTML = '';
                
                if (!seats || seats.length === 0) {
                    grid.innerHTML = '<p style="color: var(--text-secondary);">No seat data available for this show.</p>';
                    return;
                }

                // Group by row
                const rows = seats.reduce((acc, s) => {
                    const rowKey = s.row || (s.seatNumber ? s.seatNumber.charAt(0) : 'A');
                    if (!acc[rowKey]) acc[rowKey] = [];
                    acc[rowKey].push(s);
                    return acc;
                }, {});

                // Sort row keys alphabetically
                const sortedRowKeys = Object.keys(rows).sort();

                for (let rowName of sortedRowKeys) {
                    const rowDiv = document.createElement('div');
                    rowDiv.className = 'seat-row';

                    const rowLabel = document.createElement('div');
                    rowLabel.className = 'row-label';
                    rowLabel.textContent = rowName;
                    rowDiv.appendChild(rowLabel);

                    // Sort seats within row by seatNumber/col
                    rows[rowName].sort((a, b) => (a.col || 0) - (b.col || 0));

                    rows[rowName].forEach(s => {
                        const seatBtn = document.createElement('div');
                        const isBooked = s.status === 'BOOKED';
                        const isPremium = s.seatType === 'PREMIUM';
                        
                        seatBtn.className = 'seat ' + 
                            (isBooked ? 'booked ' : '') + 
                            (isPremium ? 'premium ' : '');
                        
                        seatBtn.textContent = s.seatNumber;
                        seatBtn.title = `${s.seatNumber} (${s.seatType || 'Regular'}) - ${isBooked ? 'Booked' : 'Available'}`;
                        
                        seatBtn.onclick = () => toggleSeat(s, seatBtn);
                        rowDiv.appendChild(seatBtn);
                    });
                    grid.appendChild(rowDiv);
                }

                document.getElementById('btn-book').onclick = bookSeats;

            } catch (e) {
                console.error(e);
                showToast(e.message || 'Failed to load seats', 'error');
                document.getElementById('seat-grid').innerHTML = `
                    <div style="color: var(--accent-coral); margin-top: 2rem;">
                        <p>Could not connect to seat server.</p>
                        <a href="shows.html" class="btn-secondary" style="margin-top: 1rem; display: inline-block;">Browse Other Shows</a>
                    </div>
                `;
            }
        }

        function toggleSeat(seat, el) {
            if (seat.status === 'BOOKED') return;
            const idx = selectedSeats.findIndex(s => s.id === seat.id);
            if (idx > -1) {
                selectedSeats.splice(idx, 1);
                el.classList.remove('selected');
            } else {
                selectedSeats.push(seat);
                el.classList.add('selected');
            }
            updateBar();
        }

        function updateBar() {
            const total = selectedSeats.length * ticketPrice;
            const bookBtn = document.getElementById('btn-book');
            document.getElementById('price-total').textContent = `₹${total}`;
            
            if (selectedSeats.length > 0) {
                document.getElementById('seat-labels').innerHTML = 
                    `<span class="seat-highlight-green">${selectedSeats.length} Seat(s) Selected:</span> ${selectedSeats.map(s => s.seatNumber).join(', ')}`;
                bookBtn.disabled = false;
                bookBtn.className = 'btn-success';
                bookBtn.textContent = `Confirm & Pay ₹${total}`;
            } else {
                document.getElementById('seat-labels').textContent = 'No seats selected';
                bookBtn.disabled = true;
                bookBtn.className = 'btn-primary';
                bookBtn.textContent = 'Select Seats';
            }
        }

        async function bookSeats() {
            const user = AuthService.getCurrentUser();
            if (!user) {
                sessionStorage.setItem('redirectAfterLogin', window.location.href);
                showToast('Please sign in to complete your booking', 'info');
                setTimeout(() => {
                    window.location.href = 'auth.html';
                }, 800);
                return;
            }

            const bookBtn = document.getElementById('btn-book');
            bookBtn.disabled = true;
            bookBtn.textContent = 'Securing Tickets...';

            try {
                const payload = {
                    userId: user.id,
                    showId: parseInt(showId),
                    seatIds: selectedSeats.map(s => s.id)
                };
                const res = await fetchApi('/bookings', { 
                    method: 'POST', 
                    body: JSON.stringify(payload) 
                });
                
                const seatList = selectedSeats.map(s => s.seatNumber).join(', ');
                
                // Show stunning green popup as requested!
                showSuccessPopup(
                    `Movie Booked: ${movieName}!`, 
                    `Your reservation for seats [ ${seatList} ] is confirmed. Enjoy the show!`,
                    () => {
                        window.location.href = `confirmation.html?bookingId=${res.bookingId}`;
                    }
                );
            } catch (e) {
                showToast(e.message || 'Booking failed', 'error');
                bookBtn.disabled = false;
                updateBar();
            }
        }

        init();
    </script>
</body>
</html>
